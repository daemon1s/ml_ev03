services:
  detector:
    build: .
    image: detector-patentes:local
    container_name: detector-patentes
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${DETECTOR_PORT:?falta DETECTOR_PORT en .env}:${DEMO_PORT:?falta DEMO_PORT en .env}"
    volumes:
      - "${MODEL_DIR:?falta MODEL_DIR en .env}:${TRAIN_OUTPUT_DIR:?falta TRAIN_OUTPUT_DIR en .env}:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DETECTOR_MEM_LIMIT:?falta DETECTOR_MEM_LIMIT en .env}
    cpus: ${DETECTOR_CPUS:?falta DETECTOR_CPUS en .env}
    pids_limit: 256
